name: Build Runtime Artifacts

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "Official Harness version to package, for example 0.2.0-rc.1; it is also the Runtime version"
        required: true
        type: string
      pnpm_version:
        description: "Exact pnpm version to package"
        required: false
        type: string
      plugin_market_version:
        description: "Optional exact dshmarket version; 'none' publishes no market pin; empty resolves the newest compatible"
        required: false
        type: string
      runtime_data_format_id:
        description: "Harness data format ID, for example sqlite-v2"
        required: false
        type: string
      runtime_data_format_compatible_with:
        description: "Comma-separated compatible prior format IDs"
        required: false
        type: string
      runtime_data_format_migration:
        description: "Explicit migration identifier, or leave blank"
        required: false
        type: string
      allow_catalog_downgrade:
        description: "Allow publishing a catalog older than the published one (intentional backports only)"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub Actions has no native cross-repository release trigger. Poll the
    # official Harness releases and build only when a new version is found.
    - cron: "17 * * * *"
  push:
    tags:
      - "runtime-*"
      - "!runtime-catalog"

concurrency:
  # The published catalog is a single global asset, so every run that can write
  # it shares one group even when different refs triggered them.
  group: runtime-builder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'SteveTanSaMa/DSH-Studio-Runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      runtime_version: ${{ steps.resolve.outputs.runtime_version }}
      pnpm_version: ${{ steps.resolve.outputs.pnpm_version }}
      runtime_data_format_id: ${{ steps.resolve.outputs.runtime_data_format_id }}
      runtime_data_format_compatible_with: ${{ steps.resolve.outputs.runtime_data_format_compatible_with }}
      runtime_data_format_migration: ${{ steps.resolve.outputs.runtime_data_format_migration }}
      allow_catalog_downgrade: ${{ steps.resolve.outputs.allow_catalog_downgrade }}
      plugin_market_version: ${{ steps.resolve.outputs.plugin_market_version }}
    steps:
      - name: Resolve Runtime version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          DISPATCH_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          DISPATCH_PNPM_VERSION: ${{ inputs.pnpm_version }}
          DISPATCH_PLUGIN_MARKET_VERSION: ${{ inputs.plugin_market_version }}
          DISPATCH_DATA_FORMAT_ID: ${{ inputs.runtime_data_format_id }}
          DISPATCH_DATA_FORMAT_COMPATIBLE_WITH: ${{ inputs.runtime_data_format_compatible_with }}
          DISPATCH_DATA_FORMAT_MIGRATION: ${{ inputs.runtime_data_format_migration }}
          DISPATCH_ALLOW_CATALOG_DOWNGRADE: ${{ inputs.allow_catalog_downgrade }}
          DEFAULT_PNPM_VERSION: ${{ vars.RUNTIME_PNPM_VERSION }}
          DEFAULT_PLUGIN_MARKET_VERSION: ${{ vars.RUNTIME_PLUGIN_MARKET_VERSION }}
          DEFAULT_DATA_FORMAT_ID: ${{ vars.RUNTIME_DATA_FORMAT_ID }}
          DEFAULT_DATA_FORMAT_COMPATIBLE_WITH: ${{ vars.RUNTIME_DATA_FORMAT_COMPATIBLE_WITH }}
          DEFAULT_DATA_FORMAT_MIGRATION: ${{ vars.RUNTIME_DATA_FORMAT_MIGRATION }}
          UPSTREAM_REPOSITORY: deepseek-ai/deepseek-harness
          UPSTREAM_RELEASE_TAG_PREFIX: dsh-v
          # Everything at or before this version is treated as already handled.
          # Keep it on the last Harness version that cannot be rebuilt with
          # today's dependency graph (see docs/historical-versions.md): moving it
          # forward would make the poll try that version forever and never reach
          # a newer one.
          UPSTREAM_MIN_HARNESS_VERSION: 0.1.7-rc.2
        run: |
          set -euo pipefail

          should_build=true
          allow_catalog_downgrade=false
          runtime_version="$DISPATCH_RUNTIME_VERSION"
          pnpm_version="${DISPATCH_PNPM_VERSION:-$DEFAULT_PNPM_VERSION}"
          plugin_market_version="${DISPATCH_PLUGIN_MARKET_VERSION:-$DEFAULT_PLUGIN_MARKET_VERSION}"
          data_format_id="${DISPATCH_DATA_FORMAT_ID:-$DEFAULT_DATA_FORMAT_ID}"
          data_format_compatible_with="${DISPATCH_DATA_FORMAT_COMPATIBLE_WITH:-$DEFAULT_DATA_FORMAT_COMPATIBLE_WITH}"
          data_format_migration="${DISPATCH_DATA_FORMAT_MIGRATION:-$DEFAULT_DATA_FORMAT_MIGRATION}"

          case "$EVENT_NAME" in
            schedule)
              if [ -z "$data_format_id" ]; then
                echo "::warning::Scheduled Runtime check skipped because RUNTIME_DATA_FORMAT_ID is not configured."
                should_build=false
              else
                releases="$(
                  gh api "repos/$UPSTREAM_REPOSITORY/releases?per_page=100" --paginate --slurp |
                    jq -r '
                      add
                      | map(select(.draft == false))
                      | map(select(.tag_name | test("^dsh-v[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$")))
                      | sort_by(.published_at // .created_at)
                      | .[]
                      | [.tag_name, (.published_at // .created_at)]
                      | @tsv
                    '
                )"
                runtime_version=""
                baseline_reached=false
                while IFS=$'\t' read -r upstream_tag upstream_published_at; do
                  [ -n "${upstream_tag:-}" ] || continue
                  harness_version="${upstream_tag#"$UPSTREAM_RELEASE_TAG_PREFIX"}"
                  if [ "$harness_version" = "$UPSTREAM_MIN_HARNESS_VERSION" ]; then
                    baseline_reached=true
                    continue
                  fi
                  [ "$baseline_reached" = true ] || continue
                  # One Harness version is one Runtime: the Runtime version is
                  # that version, so an existing release means it is already done.
                  runtime_tag="runtime-${harness_version}"
                  if gh release view "$runtime_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "Runtime release $runtime_tag already exists; skipping Harness release $upstream_tag ($upstream_published_at)."
                    continue
                  fi
                  if ! npm view "@deepseek-ai/dsh@$harness_version" version --registry "https://registry.npmjs.org" >/dev/null 2>&1; then
                    echo "::warning::Skipping Harness release $upstream_tag because @deepseek-ai/dsh@$harness_version is not published on npm."
                    continue
                  fi
                  runtime_version="$harness_version"
                  echo "New official Harness release $upstream_tag ($upstream_published_at); building $runtime_tag."
                  break
                done <<< "$releases"
                if [ -z "$runtime_version" ]; then
                  echo "No unbuilt official Harness release with a published npm package was found."
                  should_build=false
                fi
              fi
              ;;
            workflow_dispatch)
              [ -n "$runtime_version" ] || {
                echo "runtime_version is required for workflow_dispatch" >&2
                exit 1
              }
              if [ "$DISPATCH_ALLOW_CATALOG_DOWNGRADE" = "true" ]; then
                allow_catalog_downgrade=true
              fi
              ;;
            push)
              runtime_version="${EVENT_REF_NAME#runtime-}"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          # Free-text inputs are echoed into $GITHUB_OUTPUT, so keep them to
          # characters that cannot inject additional output lines.
          validate_token() {
            local name="$1" value="$2"
            case "$value" in
              *[!A-Za-z0-9._,+-]*) echo "$name contains unsupported characters: $value" >&2; exit 1 ;;
            esac
          }
          validate_token "pnpm_version" "$pnpm_version"
          validate_token "plugin_market_version" "$plugin_market_version"
          validate_token "runtime_data_format_id" "$data_format_id"
          validate_token "runtime_data_format_compatible_with" "$data_format_compatible_with"
          validate_token "runtime_data_format_migration" "$data_format_migration"

          if [ "$should_build" = true ]; then
            # The Runtime version is the officially published Harness version.
            runtime_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
            if [[ ! "$runtime_version" =~ $runtime_pattern ]]; then
              echo "Runtime version must be the official Harness version, for example 0.2.0-rc.1 (got: $runtime_version)" >&2
              exit 1
            fi
            case "$runtime_version" in
              *-ver[0-9]*|*-r[0-9]*|*-rebuild-[0-9]*|*-revision-[0-9]*)
                echo "Runtime version must not carry a build counter: one Harness version is one current Runtime ($runtime_version)" >&2
                exit 1
                ;;
            esac
            [ -n "$data_format_id" ] || {
              echo "RUNTIME_DATA_FORMAT_ID is required; configure the repository variable or dispatch input" >&2
              exit 1
            }
            # The packaged pnpm is part of the artifact, so it has to be pinned:
            # resolving "latest" at build time would let two builds of the same
            # Runtime version ship different contents.
            [ -n "$pnpm_version" ] || {
              echo "RUNTIME_PNPM_VERSION is required; configure the repository variable or pass pnpm_version" >&2
              exit 1
            }

            if ! npm view "@deepseek-ai/dsh@$runtime_version" version --registry "https://registry.npmjs.org" >/dev/null 2>&1; then
              echo "::warning::Skipping $runtime_version because @deepseek-ai/dsh@$runtime_version is not published on npm."
              should_build=false
            elif gh release view "runtime-$runtime_version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [ "$EVENT_NAME" = "schedule" ]; then
                echo "Runtime release runtime-$runtime_version already exists; skipping duplicate build."
                should_build=false
              else
                # An explicit dispatch or tag is how a repack is requested. The
                # version does not change, the artifacts are replaced in place,
                # and the catalog advertises the new SHA-256.
                echo "Runtime release runtime-$runtime_version already exists; repacking and replacing its artifacts."
              fi
            fi
          fi

          {
            echo "should_build=$should_build"
            echo "runtime_version=$runtime_version"
            echo "pnpm_version=$pnpm_version"
            echo "runtime_data_format_id=$data_format_id"
            echo "runtime_data_format_compatible_with=$data_format_compatible_with"
            echo "runtime_data_format_migration=$data_format_migration"
            echo "allow_catalog_downgrade=$allow_catalog_downgrade"
            echo "plugin_market_version=$plugin_market_version"
          } >> "$GITHUB_OUTPUT"

  build:
    if: needs.prepare.outputs.should_build == 'true'
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: darwin-arm64
            runner: macos-14
          - architecture: darwin-x64
            # The Intel macOS runner can remain queued indefinitely. macos-14
            # is currently available as Apple Silicon; build-runtime.sh
            # executes the downloaded x64 Node under Rosetta for this target.
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and smoke-test Runtime
        env:
          RUNTIME_DATA_FORMAT_ID: ${{ needs.prepare.outputs.runtime_data_format_id }}
          RUNTIME_DATA_FORMAT_COMPATIBLE_WITH: ${{ needs.prepare.outputs.runtime_data_format_compatible_with }}
          RUNTIME_DATA_FORMAT_MIGRATION: ${{ needs.prepare.outputs.runtime_data_format_migration }}
          RUNTIME_HARNESS_VERSION: ${{ needs.prepare.outputs.runtime_version }}
          RUNTIME_PNPM_VERSION: ${{ needs.prepare.outputs.pnpm_version }}
          PLUGIN_MARKET_VERSION_INPUT: ${{ needs.prepare.outputs.plugin_market_version }}
          RUNTIME_VERSION_INPUT: ${{ needs.prepare.outputs.runtime_version }}
          RUNTIME_ARTIFACT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/runtime-${{ needs.prepare.outputs.runtime_version }}
          BUILD_SOURCE_COMMIT: ${{ github.sha }}
          BUILD_SOURCE_REF: ${{ github.ref }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          runtime_version="$RUNTIME_VERSION_INPUT"
          RUNTIME_VERSION="$runtime_version" \
          ARCHITECTURE="${{ matrix.architecture }}" \
          HARNESS_VERSION="$RUNTIME_HARNESS_VERSION" \
          PNPM_VERSION="$RUNTIME_PNPM_VERSION" \
          PLUGIN_MARKET_VERSION="$PLUGIN_MARKET_VERSION_INPUT" \
          DSH_RUNTIME_DATA_FORMAT_ID="$RUNTIME_DATA_FORMAT_ID" \
          DSH_RUNTIME_DATA_FORMAT_COMPATIBLE_WITH="${RUNTIME_DATA_FORMAT_COMPATIBLE_WITH:-}" \
          DSH_RUNTIME_DATA_FORMAT_MIGRATION="${RUNTIME_DATA_FORMAT_MIGRATION:-}" \
          OUTPUT_DIR="${{ github.workspace }}/RuntimeArtifacts" \
            ./Scripts/build-runtime.sh

      - name: Upload Runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.architecture }}
          path: RuntimeArtifacts/*
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.should_build == 'true' && github.repository == 'SteveTanSaMa/DSH-Studio-Runtime'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Protected environment: the signing key is only visible to this job, and
    # every publish is recorded against the environment.
    environment: runtime-signing
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: RuntimeArtifacts
          merge-multiple: true

      - name: Publish immutable Runtime release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_CATALOG_PRIVATE_KEY_BASE64: ${{ secrets.RUNTIME_CATALOG_PRIVATE_KEY_BASE64 }}
          RUNTIME_VERSION_INPUT: ${{ needs.prepare.outputs.runtime_version }}
          HARNESS_VERSION_INPUT: ${{ needs.prepare.outputs.runtime_version }}
          ALLOW_CATALOG_DOWNGRADE_INPUT: ${{ needs.prepare.outputs.allow_catalog_downgrade }}
        run: |
          set -euo pipefail

          runtime_version="$RUNTIME_VERSION_INPUT"
          release_tag="runtime-${runtime_version}"
          upload_attempts=5

          # The trust anchor is public and committed, so the signing key cannot
          # silently rotate away from what shipped clients trust.
          key_id="$(sed -n 's/^keyID=//p' keys/runtime-catalog-public.txt | head -1)"
          public_key="$(sed -n 's/^publicKey=//p' keys/runtime-catalog-public.txt | head -1)"
          if [ -z "$key_id" ] || [ -z "$public_key" ]; then
            echo "keys/runtime-catalog-public.txt is missing keyID or publicKey" >&2
            exit 1
          fi
          export RUNTIME_CATALOG_KEY_ID="$key_id"
          export RUNTIME_CATALOG_PUBLIC_KEY="$public_key"

          upload_asset() {
            # uploads.github.com intermittently answers HTTP 500 for large
            # assets. An aborted upload leaves the release behind, and the
            # release tag then makes every later run skip that Runtime version,
            # so retry here instead of failing the whole publish.
            local release_tag="$1" file="$2" label="$3"
            shift 3
            local name size attempt=1 delay=15 remote
            name="$(basename "$file")"
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            while [ "$attempt" -le "$upload_attempts" ]; do
              echo "Uploading $label $name ($size bytes), attempt $attempt/$upload_attempts"
              if gh release upload "$release_tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber "$@"; then
                # A truncated upload can still return success, and the release
                # is immutable once clients recorded its checksum, so assert the
                # stored asset size before moving on. The post-publish job then
                # re-downloads the published bytes and checks the checksum.
                remote="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
                  --jq ".assets[] | select(.name == \"${name}\") | .size" | head -1)"
                if [ "$remote" = "$size" ]; then
                  echo "Verified $name ($remote bytes)"
                  return 0
                fi
                echo "::warning::$name stored size ${remote:-<missing>} does not match local size $size" >&2
              else
                echo "::warning::Upload attempt $attempt for $name failed" >&2
              fi
              attempt=$((attempt + 1))
              if [ "$attempt" -le "$upload_attempts" ]; then
                echo "Retrying $name in ${delay}s"
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "Failed to upload $name after $upload_attempts attempts" >&2
            return 1
          }

          # The catalog must describe bytes that were verified in this run.
          ./Scripts/generate-runtime-catalog.sh \
            "$runtime_version" \
            RuntimeArtifacts/runtime-release.json \
            RuntimeArtifacts/artifact-*.json

          # ... and it must never move backwards or replace published bytes.
          if gh release view runtime-catalog --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p RuntimeArtifacts/previous
            gh release download runtime-catalog \
              --repo "$GITHUB_REPOSITORY" \
              --pattern runtime-catalog.signed.json \
              --dir RuntimeArtifacts/previous \
              --clobber
            ./Scripts/verify-runtime-catalog.sh \
              RuntimeArtifacts/previous/runtime-catalog.signed.json \
              "$RUNTIME_CATALOG_PUBLIC_KEY" \
              RuntimeArtifacts/previous/payload.json
            allow_downgrade=0
            if [ "$ALLOW_CATALOG_DOWNGRADE_INPUT" = "true" ]; then
              allow_downgrade=1
            fi
            ALLOW_CATALOG_DOWNGRADE="$allow_downgrade" \
              ./Scripts/check-catalog-precedent.sh \
              RuntimeArtifacts/previous/payload.json \
              RuntimeArtifacts/runtime-release.json
          else
            echo "No published catalog yet; skipping the precedent check."
          fi

          ./Scripts/sign-runtime-catalog.sh \
            RuntimeArtifacts/runtime-release.json \
            RuntimeArtifacts/runtime-catalog.signed.json

          # One Harness version is one current Runtime, so the release carries the
          # Harness version and nothing else. A repack replaces the artifacts of
          # this release and lands in the notes, not in the name.
          release_title="Runtime ${runtime_version}"

          notes_file="$RUNNER_TEMP/runtime-release-notes.md"
          node - "$notes_file" RuntimeArtifacts "$runtime_version" <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const [notesPath, artifactsDirectory, runtimeVersion] = process.argv.slice(2);
          const metadata = fs
            .readdirSync(artifactsDirectory)
            .filter((name) => /^artifact-.*\.json$/.test(name))
            .map((name) => JSON.parse(fs.readFileSync(path.join(artifactsDirectory, name), "utf8")))
            .sort((left, right) => left.architecture.localeCompare(right.architecture));
          if (metadata.length !== 2) {
            throw new Error(`expected two artifact metadata files, found ${metadata.length}`);
          }

          const first = metadata[0];
          const provenance = first.provenance || {};
          const lines = [
            "DSH Studio Runtime artifact.",
            "",
            "| | |",
            "| --- | --- |",
            `| Harness | \`${first.harnessVersion}\` |`,
            `| Platform | \`${first.platform || "macos"}\` |`,
            `| Node | \`${first.nodeVersion}\` |`,
            `| pnpm | \`${first.pnpmVersion}\` |`,
            `| Data format | \`${first.dataFormat.id}\` |`,
            `| Plugin market | ${first.pluginMarket
              ? `\`${first.pluginMarket.package}@${first.pluginMarket.version}\``
              : "_not pinned; DSH Studio falls back to its compiled pin_"} |`,
            `| Dependency lock | \`${first.dependencyLockSHA256 || "unknown"}\` |`
          ];
          if (provenance.commit || provenance.runId) {
            lines.push(
              `| Built from | \`${provenance.commit || "unknown"}\` (${provenance.ref || "unknown"}), ` +
              `run ${provenance.runId || "unknown"} |`);
          }
          lines.push(
            "",
            `The Runtime version is the Harness version \`${runtimeVersion}\`: repacking it replaces these`,
            "artifacts in place, and the catalog's SHA-256 is what clients verify.",
            "",
            "| Architecture | Artifact | SHA-256 | Size |",
            "| --- | --- | --- | --- |"
          );
          for (const release of metadata) {
            lines.push(
              `| \`${release.architecture}\` | \`${release.artifact}\` | \`${release.sha256}\` | ${release.size} bytes |`);
          }
          lines.push(
            "",
            "DSH Studio installs this build through the signed catalog:",
            `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/runtime-catalog/runtime-catalog.signed.json`
          );
          fs.writeFileSync(notesPath, lines.join("\n") + "\n");
          NODE

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; completing it instead of recreating it."
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$notes_file"
            # Recorded so a failure below can remove the half-published release
            # instead of leaving the version permanently unbuildable.
            touch "$RUNNER_TEMP/runtime-release-created"
          fi

          # Publish the large immutable payloads first. They are what the
          # catalog advertises, so the catalog must never mention a Runtime
          # whose artifacts are not downloadable yet.
          for file in RuntimeArtifacts/dsh-runtime-*.tar.gz; do
            upload_asset "$release_tag" "$file" artifact
          done
          for file in RuntimeArtifacts/artifact-*.json RuntimeArtifacts/manifest-*.json; do
            upload_asset "$release_tag" "$file" metadata
          done
          upload_asset "$release_tag" RuntimeArtifacts/runtime-release.json metadata

          if ! gh release view runtime-catalog --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create runtime-catalog \
              --repo "$GITHUB_REPOSITORY" \
              --title "Runtime catalog" \
              --notes "Signed Runtime catalog for DSH Studio automatic discovery."
          fi
          upload_asset runtime-catalog RuntimeArtifacts/runtime-catalog.signed.json catalog

          # The version is fully published, so later failures must not roll it
          # back.
          rm -f "$RUNNER_TEMP/runtime-release-created"

      - name: Remove a partially published release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_VERSION_INPUT: ${{ needs.prepare.outputs.runtime_version }}
        run: |
          set -euo pipefail

          # An existing release makes every later run skip this Runtime
          # version, so a release that never got its full set of assets has to
          # be removed for the next run (or the next scheduled poll) to rebuild
          # it.
          if [ ! -f "$RUNNER_TEMP/runtime-release-created" ]; then
            echo "No release was created in this run; nothing to remove."
            exit 0
          fi
          tag="runtime-$RUNTIME_VERSION_INPUT"
          echo "Removing $tag so the next run can publish it again."
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag

  verify-published:
    # Re-downloads what clients will download. Needs no secret: the trust anchor
    # is public and the checksums come from the signed catalog itself.
    if: needs.prepare.outputs.should_build == 'true' && github.repository == 'SteveTanSaMa/DSH-Studio-Runtime'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify the published catalog and artifacts
        env:
          RUNTIME_VERSION_INPUT: ${{ needs.prepare.outputs.runtime_version }}
        run: |
          set -euo pipefail
          public_key="$(sed -n 's/^publicKey=//p' keys/runtime-catalog-public.txt | head -1)"
          if [ -z "$public_key" ]; then
            echo "keys/runtime-catalog-public.txt is missing publicKey" >&2
            exit 1
          fi
          ./Scripts/verify-published-runtime.sh "$RUNTIME_VERSION_INPUT" "$public_key"
